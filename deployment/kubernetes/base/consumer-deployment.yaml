apiVersion: apps/v1
kind: Deployment
metadata:
  name: tz-consumer
  namespace: tz
  labels:
    app: tz-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tz-consumer
  template:
    metadata:
      labels:
        app: tz-consumer
    spec:
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for RabbitMQ..."
          until nc -z rabbitmq-service 5672; do
            echo "RabbitMQ not ready, waiting..."
            sleep 2
          done
          echo "RabbitMQ is ready!"
      containers:
      - name: consumer
        image: vasiliysilver/tz-consumer:latest
        imagePullPolicy: Always
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: tz-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: tz-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: tz-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: tz-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tz-secrets
              key: POSTGRES_PASSWORD
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: tz-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: tz-config
              key: RABBITMQ_PORT
        - name: RABBITMQ_USER
          valueFrom:
            configMapKeyRef:
              name: tz-config
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tz-secrets
              key: RABBITMQ_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"