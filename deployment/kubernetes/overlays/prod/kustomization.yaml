apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tz

resources:
  - ../../base
  - api-ingress.yaml

patches:
  - path: api-deployment-patch.yaml
    target:
      kind: Deployment
      name: tz-api
  - path: consumer-deployment-patch.yaml
    target:
      kind: Deployment
      name: tz-consumer

commonLabels:
  environment: production